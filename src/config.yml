# allow html to render in md files
markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  Description: "Hi my name is Clayton. I am a student at the University of Massachusetts Lowell Studying Computer Engineering. interested in a plethora of things including but not limited to, programming,  electronics, art, welding, robots, and machine learning."
  defaultTheme: dark
  TocSide: left
  external: true

  # security:
  #   enableInlineShortcodes: true

  profileMode:
        enabled: true
        title: |
           Hello and Welcome !

           I'm Clayton Easley a Computer Engineer 
          
        subtitle: >
          Hi, my name is Clayton. I am currently a student at the University of Massachusetts Lowell! I created this site to journal my projects, ideas, and life experiences, and it sits somewhere between a blog and a Portfolio.


          Some projects are still in progress; excuse the underdeveloped posts. 
        # imageUrl: "<image link>" # optional
        # imageTitle: "<title of image as alt>" # optional
        imageWidth: 120 # custom size
        imageHeight: 120 # custom size
        buttons:
        - identifier: About Me
          name: About Me
          url: /posts/about
        - identifier: projects
          name: Projects
          url: /posts/myprojects/
        - identifier: Notes
          name: Notes
          url: /posts/notes/


  contentDir: content
  
  ShowBreadCrumbs: true
  ShowShareButtons: true
  ShowPostNavLinks: true

  ShowReadingTime: true
  ShowWordCount: true
  EnableImageZoom: true
  ShowCodeCopyButtons: true


  keywords: [Blog, Portfolio, Engineering, Computers, Codeing]

